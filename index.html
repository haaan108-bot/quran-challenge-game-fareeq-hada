<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي ص 8 - سورة البقرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald: #065f46;
            --gold: #d4af37;
            --soft-gold: #fcf6ba;
            --bg-light: #f8fafc;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            color: #333;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .quran-font {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            line-height: 2.2;
        }

        .islamic-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png');
            opacity: 0.1; pointer-events: none; z-index: 0;
        }

        .word-card {
            background: white;
            border: 2px solid var(--soft-gold);
            border-radius: 12px;
            padding: 10px 20px;
            margin: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
            display: inline-block;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--emerald);
        }

        .word-card:active { transform: scale(0.95); }

        .drop-zone {
            min-height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px dashed var(--gold);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            padding: 20px; margin-bottom: 20px;
        }

        .success-animation { animation: celebrate 0.5s ease; }
        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); filter: brightness(1.2); }
            100% { transform: scale(1); }
        }

        .floating-star {
            position: absolute; color: var(--gold); pointer-events: none;
            animation: floatUp 1s forwards;
        }
        @keyframes floatUp { to { transform: translateY(-100px); opacity: 0; } }

        .moon {
            position: absolute; top: 20px; right: 30px; font-size: 3rem; color: var(--soft-gold);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .hidden { display: none !important; }

        .progress-bar {
            height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px;
            overflow: hidden; width: 100%; margin-top: 10px;
        }
        .progress-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.5s ease; }

        .character { width: 120px; height: auto; margin: 0 auto; animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        #success-modal {
            background: rgba(0, 0, 0, 0.8); position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: white; border-radius: 25px; padding: 40px; text-align: center;
            max-width: 400px; width: 100%; border: 5px solid var(--gold);
        }
    </style>
</head>
<body>

<div class="islamic-pattern"></div>
<div class="moon">🌙</div>

<div id="start-screen" class="flex-grow flex flex-col items-center justify-center relative z-10 p-6 text-center">
    <div class="character">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="40" r="30" fill="#fce7f3" />
            <rect x="35" y="70" width="30" height="30" rx="10" fill="#065f46" />
            <path d="M40 35 Q50 45 60 35" stroke="#333" stroke-width="2" fill="none" />
            <circle cx="40" cy="30" r="3" fill="#333" />
            <circle cx="60" cy="30" r="3" fill="#333" />
        </svg>
    </div>
    <h1 class="text-3xl md:text-5xl font-bold text-white mb-6 mt-4 drop-shadow-lg">تحدي ص 8 - سورة البقرة</h1>
    
    <div id="name-section" class="mb-6 w-full max-w-xs mx-auto">
        <input type="text" id="player-name-input" placeholder="اكتب اسمك يا بطل..." 
               class="w-full p-4 rounded-2xl text-center text-emerald-900 font-bold border-4 border-yellow-500 outline-none focus:ring-4 focus:ring-yellow-300 transition">
    </div>

    <button id="start-btn" class="bg-gradient-to-r from-yellow-400 to-yellow-600 text-emerald-900 font-bold py-4 px-12 rounded-full text-2xl shadow-xl transform transition hover:scale-110 active:scale-95">
        ابدأ التحدي
    </button>
    
    <p id="welcome-back" class="text-white mt-4 hidden">أهلاً بك مجدداً، <span id="saved-name-display" class="font-bold text-yellow-400"></span>!</p>

    <div class="mt-8 grid grid-cols-3 gap-4 text-white">
        <div class="bg-black/20 p-3 rounded-xl backdrop-blur">
            <div class="text-2xl font-bold">⭐ <span id="total-stars-start">0</span></div>
            <div class="text-xs">النجوم</div>
        </div>
        <div class="bg-black/20 p-3 rounded-xl backdrop-blur">
            <div class="text-2xl font-bold">🏆 <span id="high-score-start">0</span></div>
            <div class="text-xs">أفضل نتيجة</div>
        </div>
        <div class="bg-black/20 p-3 rounded-xl backdrop-blur">
            <div class="text-2xl font-bold">📖 8</div>
            <div class="text-xs">الصفحة</div>
        </div>
    </div>
</div>

<div id="game-screen" class="hidden flex-grow flex flex-col p-4 relative z-10 max-w-4xl mx-auto w-full">
    <div class="flex justify-between items-center text-white mb-4">
        <div class="flex flex-col">
            <span class="bg-yellow-500 text-emerald-900 px-3 py-1 rounded-full font-bold text-sm mb-1">⭐ <span id="current-score">0</span></span>
            <div class="text-xs font-bold bg-emerald-800/50 px-3 py-1 rounded-full">اللاعب: <span id="display-name" class="text-yellow-400"></span></div>
        </div>
        <div class="flex flex-col items-center flex-grow mx-4">
            <span class="text-xs font-bold mb-1">التقدم في الحفظ</span>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>
        <div class="bg-black/30 px-3 py-1 rounded-full font-bold text-sm">⏱️ <span id="timer">00:00</span></div>
    </div>

    <div id="verse-container" class="bg-white/95 rounded-3xl p-6 shadow-2xl mb-6 relative overflow-hidden">
        <h2 class="text-center text-emerald-800 font-bold mb-4 opacity-70">رتب الكلمات لتكمل الآية:</h2>
        <div id="target-zone" class="drop-zone quran-font"></div>
        <div id="source-zone" class="flex flex-wrap justify-center gap-2 min-h-[100px]"></div>
    </div>

    <div class="flex justify-center gap-4">
        <button id="reset-verse" class="bg-white/20 text-white px-6 py-2 rounded-xl hover:bg-white/30">إعادة الترتيب</button>
    </div>
</div>

<div id="success-modal" class="hidden">
    <div class="modal-content">
        <div class="text-6xl mb-4">✨</div>
        <h2 class="text-3xl font-bold text-emerald-800 mb-2">أحسنت يا <span id="modal-player-name"></span>!</h2>
        <p class="text-gray-600 mb-6" id="modal-msg">لقد اجتزت التحدي بنجاح!</p>
        <div class="bg-emerald-50 rounded-2xl p-4 mb-6">
            <div class="text-sm text-emerald-600">النقاط التي حصلت عليها</div>
            <div class="text-4xl font-bold text-emerald-900" id="final-score">0</div>
        </div>
        <button id="next-level-btn" class="bg-emerald-600 text-white font-bold py-3 px-10 rounded-full text-xl hover:bg-emerald-700 w-full mb-3">المستوى التالي</button>
        <button id="restart-game" class="text-emerald-600 font-bold hover:underline">العودة للرئيسية</button>
    </div>
</div>

<script>
    const verses = [
        "وَإِذْ نَجَّيْنَاكُم مِّنْ آلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوءَ الْعَذَابِ يُذَبِّحُونَ أَبْنَاءَكُمْ وَيَسْتَحْيُونَ نِسَاءَكُمْ ۚ وَفِي ذَٰلِكُم بَلَاءٌ مِّن رَّبِّكُمْ عَظِيمٌ",
        "وَإِذْ فَرَقْنَا بِكُمُ الْبَحْرَ فَأَنجَيْنَاكُمْ وَأَغْرَقْنَا آلَ فِرْعَوْنَ وَأَنتُمْ تَنظُرُونَ",
        "وَإِذْ وَاعَدْنَا مُوسَىٰ أَرْبَعِينَ لَيْلَةً ثُمَّ اتَّخَذْتُمُ الْعِجْلَ مِن بَعْدِهِ وَأَنتُمْ ظَالِمُونَ",
        "ثُمَّ عَفَوْنَا عَنكُم مِّن بَعْدِ ذَٰلِكَ لَعَلَّكُمْ تَشْكُرُونَ",
        "وَإِذْ آتَيْنَا مُوسَى الْكِتَابَ وَالْفُرْقَانَ لَعَلَّكُمْ تَهْتَدُونَ",
        "وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ يَا قَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنفُسَكُم بِاتِّخَاذِكُمُ الْعِجْلَ فَتُوبُوا إِلَىٰ بارِئِكُمْ فَاقْتُلُوا أَنفُسَكُمْ ذَٰلِكُمْ خَيْرٌ لَّكُمْ عِندَ بَارِئِكُمْ فَتَابَ عَلَيْكُمْ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ",
        "وَإِذْ قُلْتُمْ يَا مُوسَىٰ لَن نُّؤْمِنَ لَكَ حَتَّىٰ نَرَى اللَّهَ جَهْرَةً فَأَخَذَتْكُمُ الصَّاعِقَةُ وَأَنتُمْ تَنظُرُونَ",
        "ثُمَّ بَعَثْنَاكُم مِّن بَعْدِ مَوْتِكُمْ لَعَلَّكُمْ تَشْكُرُونَ",
        "وَظَلَّلْنَا عَلَيْكُمُ الْغَمَامَ وَأَنزَلْنَا عَلَيْكُمُ الْمَنَّ وَالسَّلْوَىٰ ۖ كُلُوا مِن طَيِّبَاتِ مَا رَزَقْنَاكُمْ ۖ وَمَا ظَلَمُونَا وَلَٰكِن كَانُوا أَنفُسَهُمْ يَظْلِمُونَ"
    ];

    let currentVerseIndex = 0, score = 0, timerInterval, seconds = 0, placedWords = [], currentVerseWords = [];

    const startScreen = document.getElementById('start-screen'), gameScreen = document.getElementById('game-screen');
    const sourceZone = document.getElementById('source-zone'), targetZone = document.getElementById('target-zone');
    const successModal = document.getElementById('success-modal'), scoreDisplay = document.getElementById('current-score');
    const progressFill = document.getElementById('progress-fill'), timerDisplay = document.getElementById('timer');

    window.onload = () => {
        const savedName = localStorage.getItem('quran_player_name');
        document.getElementById('high-score-start').innerText = localStorage.getItem('quran_high_score') || 0;
        document.getElementById('total-stars-start').innerText = localStorage.getItem('quran_stars') || 0;
        if (savedName) {
            document.getElementById('player-name-input').value = savedName;
            document.getElementById('welcome-back').classList.remove('hidden');
            document.getElementById('saved-name-display').innerText = savedName;
        }
    };

    document.getElementById('start-btn').onclick = () => {
        const nameInput = document.getElementById('player-name-input').value.trim();
        if (!nameInput) return alert("لطفاً، اكتب اسمك أولاً!");
        localStorage.setItem('quran_player_name', nameInput);
        document.getElementById('display-name').innerText = nameInput;
        document.getElementById('modal-player-name').innerText = nameInput;
        startScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
        loadVerse(0); startTimer();
    };

    function loadVerse(index) {
        if (index >= verses.length) return showFinalSuccess();
        currentVerseWords = verses[index].split(' ').filter(w => w.trim());
        placedWords = [];
        progressFill.style.width = `${(index / verses.length) * 100}%`;
        const jumbled = [...currentVerseWords].sort(() => Math.random() - 0.5);
        sourceZone.innerHTML = ''; targetZone.innerHTML = '';
        jumbled.forEach(word => {
            const card = document.createElement('div'); card.className = 'word-card'; card.innerText = word;
            card.onclick = () => {
                if (word === currentVerseWords[placedWords.length]) {
                    placedWords.push(word); card.style.opacity = '0'; card.style.pointerEvents = 'none';
                    const targetCard = document.createElement('div
