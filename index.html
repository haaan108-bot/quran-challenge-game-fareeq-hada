<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي ص 8 - سورة البقرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --emerald: #065f46; --gold: #d4af37; --soft-gold: #fcf6ba; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            color: #333; min-height: 100vh; margin: 0; display: flex; flex-direction: column;
        }
        .quran-font { font-family: 'Amiri', serif; font-size: 1.5rem; line-height: 2.2; }
        .word-card {
            background: white; border: 2px solid var(--soft-gold); border-radius: 12px;
            padding: 10px 18px; margin: 6px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block;
            font-weight: bold; font-size: 1.1rem; color: var(--emerald);
        }
        .drop-zone {
            min-height: 120px; background: rgba(255, 255, 255, 0.1);
            border: 2px dashed var(--gold); border-radius: 20px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            padding: 15px; margin-bottom: 20px;
        }
        .hidden { display: none !important; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; width: 100%; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--gold); width: 0%; transition: 0.4s; }
        #success-modal {
            background: rgba(0, 0, 0, 0.85); position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
    </style>
</head>
<body>

<div id="start-screen" class="flex-grow flex flex-col items-center justify-center p-6 text-center">
    <h1 class="text-3xl font-bold text-white mb-8">تحدي ص 8 - سورة البقرة</h1>
    
    <div class="mb-6 w-full max-w-xs">
        <input type="text" id="player-name-input" placeholder="اكتب اسمك هنا..." 
               class="w-full p-4 rounded-xl text-center font-bold outline-none border-4 border-yellow-500">
    </div>

    <button onclick="startGame()" class="bg-yellow-500 text-emerald-900 font-bold py-4 px-12 rounded-full text-2xl shadow-xl active:scale-95 transition">
        ابدأ التحدي
    </button>
    
    <div id="welcome-back" class="text-white mt-6 hidden">
        أهلاً بك مجدداً: <span id="saved-name-display" class="text-yellow-400"></span>
    </div>
</div>

<div id="game-screen" class="hidden flex-grow flex flex-col p-4 max-w-4xl mx-auto w-full">
    <div class="flex justify-between items-center text-white mb-6 bg-black/20 p-3 rounded-2xl">
        <div class="text-sm">اللاعب: <span id="display-name" class="text-yellow-400 font-bold"></span></div>
        <div class="flex-grow mx-4">
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
        <div class="text-sm">⭐ <span id="current-score">0</span></div>
    </div>

    <div class="bg-white/95 rounded-3xl p-6 shadow-2xl mb-4">
        <div id="target-zone" class="drop-zone quran-font"></div>
        <div id="source-zone" class="flex flex-wrap justify-center gap-1"></div>
    </div>
    
    <button onclick="resetVerse()" class="text-white/70 text-sm underline">إعادة ترتيب الآية</button>
</div>

<div id="success-modal" class="hidden">
    <div class="bg-white rounded-3xl p-8 text-center max-w-sm w-full border-4 border-gold">
        <div class="text-5xl mb-4">✨</div>
        <h2 class="text-2xl font-bold text-emerald-800 mb-2">أحسنت يا <span id="modal-player-name"></span></h2>
        <p class="mb-6">نقاطك: <span id="final-score" class="font-bold text-xl">0</span></p>
        <button id="next-btn" onclick="loadNextVerse()" class="bg-emerald-600 text-white font-bold py-3 px-8 rounded-full w-full mb-2">الآية التالية</button>
        <button onclick="location.reload()" class="text-gray-500 text-sm">خروج</button>
    </div>
</div>

<script>
    const verses = [
        "وَإِذْ نَجَّيْنَاكُم مِّنْ آلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوءَ الْعَذَابِ يُذَبِّحُونَ أَبْنَاءَكُمْ وَيَسْتَحْيُونَ نِسَاءَكُمْ ۚ وَفِي ذَٰلِكُم بَلَاءٌ مِّن رَّبِّكُمْ عَظِيمٌ",
        "وَإِذْ فَرَقْنَا بِكُمُ الْبَحْرَ فَأَنجَيْنَاكُمْ وَأَغْرَقْنَا آلَ فِرْعَوْنَ وَأَنتُمْ تَنظُرُونَ",
        "وَإِذْ وَاعَدْنَا مُوسَىٰ أَرْبَعِينَ لَيْلَةً ثُمَّ اتَّخَذْتُمُ الْعِجْلَ مِن بَعْدِهِ وَأَنتُمْ ظَالِمُونَ",
        "ثُمَّ عَفَوْنَا عَنكُم مِّن بَعْدِ ذَٰلِكَ لَعَلَّكُمْ تَشْكُرُونَ",
        "وَإِذْ آتَيْنَا مُوسَى الْكِتَابَ وَالْفُرْقَانَ لَعَلَّكُمْ تَهْتَدُونَ",
        "وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِ يَا قَوْمِ إِنَّكُمْ ظَلَمْتُمْ أَنفُسَكُم بِاتِّخَاذِكُمُ الْعِجْلَ فَتُوبُوا إِلَىٰ بَارِئِكُمْ فَاقْتُلُوا أَنفُسَكُمْ ذَٰلِكُمْ خَيْرٌ لَّكُمْ عِندَ بَارِئِكُمْ فَتَابَ عَلَيْكُمْ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ",
        "وَإِذْ قُلْتُمْ يَا مُوسَىٰ لَن نُّؤْمِنَ لَكَ حَتَّىٰ نَرَى اللَّهَ جَهْرَةً فَأَخَذَتْكُمُ الصَّاعِقَةُ وَأَنتُمْ تَنظُرُونَ",
        "ثُمَّ بَعَثْنَاكُم مِّن بَعْدِ مَوْتِكُمْ لَعَلَّكُمْ تَشْكُرُونَ",
        "وَظَلَّلْنَا عَلَيْكُمُ الْغَمَامَ وَأَنزَلْنَا عَلَيْكُمُ الْمَنَّ وَالسَّلْوَىٰ ۖ كُلُوا مِن طَيِّبَاتِ مَا رَزَقْنَاكُمْ ۖ وَمَا ظَلَمُونَا وَلَٰكِن كَانُوا أَنفُسَهُمْ يَظْلِمُونَ"
    ];

    let currentVerseIndex = 0, score = 0, placedWords = [], currentVerseWords = [];

    window.onload = () => {
        const name = localStorage.getItem('quran_name');
        if (name) {
            document.getElementById('player-name-input').value = name;
            document.getElementById('welcome-back').classList.remove('hidden');
            document.getElementById('saved-name-display').innerText = name;
        }
    };

    function startGame() {
        const name = document.getElementById('player-name-input').value.trim();
        if (!name) return alert("من فضلك اكتب اسمك!");
        localStorage.setItem('quran_name', name);
        document.getElementById('display-name').innerText = name;
        document.getElementById('modal-player-name').innerText = name;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadVerse(0);
    }

    function loadVerse(index) {
        if (index >= verses.length) {
            document.getElementById('modal-msg').innerText = "تم ختم الصفحة!";
            document.getElementById('next-btn').classList.add('hidden');
            return;
        }
        currentVerseWords = verses[index].split(' ').filter(w => w.trim());
        placedWords = [];
        document.getElementById('progress-fill').style.width = (index / verses.length * 100) + '%';
        const jumbled = [...currentVerseWords].sort(() => Math.random() - 0.5);
        
        const source = document.getElementById('source-zone');
        const target = document.getElementById('target-zone');
        source.innerHTML = ''; target.innerHTML = '';

        jumbled.forEach(word => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerText = word;
            card.onclick = () => {
                if (word === currentVerseWords[placedWords.length]) {
                    placedWords.push(word);
                    card.classList.add('hidden');
                    const tCard = document.createElement('div');
                    tCard.className = 'word-card';
                    tCard.innerText = word;
                    target.appendChild(tCard);
                    score += 10;
                    document.getElementById('current-score').innerText = score;
                    if (placedWords.length === currentVerseWords.length) {
                        setTimeout(() => {
                            document.getElementById('final-score').innerText = score;
                            document.getElementById('success-modal').classList.remove('hidden');
                        }, 500);
                    }
                } else {
                    card.style.borderColor = 'red';
                    setTimeout(() => card.style.borderColor = '#fcf6ba', 500);
                }
            };
            source.appendChild(card);
        });
    }

    function loadNextVerse() {
        document.getElementById('success-modal').classList.add('hidden');
        currentVerseIndex++;
        loadVerse(currentVerseIndex);
    }

    function resetVerse() { loadVerse(currentVerseIndex); }
</script>
</body>
</html>
